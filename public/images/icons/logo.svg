<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="iconTitle">
    <title id="iconTitle">EC — Expense Collector</title>
    <defs>
        <linearGradient id="gradSquare" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5b8e7d" />
            <stop offset="1" stop-color="#f4e285" />
        </linearGradient>
    </defs>

    <!-- Rounded gradient background -->
    <rect width="100%" height="100%" rx="28" fill="url(#gradSquare)" />

    <!-- Main initials -->
    <text x="50%" y="52%" font-family="Inter, sans-serif" font-size="72" font-weight="800" text-anchor="middle"
        fill="white" letter-spacing="4">
        EC
    </text>

    <!-- Tagline -->
    <text x="50%" y="72%" font-family="Inter, sans-serif" font-size="16" font-weight="500" text-anchor="middle"
        fill="white" letter-spacing="1">
        Expense Collector
    </text>
</svg>